<!doctype html>
<html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import * as L from './lib.js';
const story = new URLSearchParams(location.search).get('story');
const mod = await import(`/stories/${story}/shots.js`);
await L.loadFonts();
const qs = new URLSearchParams(location.search);
L.init(document.getElementById('c'), +(qs.get('w') || 720), +(qs.get('h') || 1280));
let update = null, dur = 1;
window.studio = {
  shots: Object.keys(mod.shots),
  build(id, d) { dur = d; update = mod.shots[id](L, d); return true; },
  frame(t, q, cam) { update(t, dur); if (cam) { L.camera.position.set(cam[0], cam[1], cam[2]); L.camera.lookAt(cam[3], cam[4], cam[5]); } L.render(); return L.snapshot(q); },
};
window.ready = true;
</script></body></html>
